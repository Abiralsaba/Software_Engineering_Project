<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovShop | Govt of Bangladesh</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/shop_images.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Shop Page Specific Styles */
        .shop-content {
            padding: 2rem 2.5rem;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            padding: 1.5rem 2.5rem;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-bar h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 106, 78, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 600;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 106, 78, 0.4);
        }

        .cart-count-badge {
            background: white;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            padding-bottom: 2rem;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(52, 211, 153, 0.1), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            /* KEY FIX: Allows clicks to pass through */
            z-index: 1;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-img {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--text-muted);
            transition: transform 0.4s;
            position: relative;
            z-index: 2;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #fff;
            position: relative;
            z-index: 2;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
            flex-grow: 1;
            position: relative;
            z-index: 2;
        }

        .product-price {
            color: #34d399;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
            position: relative;
            z-index: 2;
        }

        .btn-buy {
            background: var(--glass-bg, rgba(255, 255, 255, 0.1));
            color: white;
            border: 1px solid rgba(52, 211, 153, 0.5);
            padding: 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            z-index: 10;
            /* Ensure button is on top */
        }

        .btn-buy:hover {
            background: #34d399;
            border-color: #34d399;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 240px 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                left: -100%;
                width: 280px;
                height: 100vh;
                box-shadow: 10px 0 20px rgba(0, 0, 0, 0.5);
                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .menu-toggle {
                display: block;
                margin-right: 1rem;
            }

            .header-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 1.5rem;
                padding: 1.2rem;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
            }

            .cart-btn {
                justify-content: center;
                width: 100%;
            }

            .main-content {
                padding: 1.5rem;
            }

            .header-bar h1 {
                font-size: 1.5rem;
            }
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-header h2 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: white;
        }

        .modal-header h2 i {
            color: #34d399;
        }

        .close-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
            transform: rotate(90deg);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            font-size: 1.1rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }

        .back-btn-shop {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }

        .back-btn-shop:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #34d399;
            transform: translateX(-3px);
        }
    </style>
</head>

<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="userName">Loading...</h3>
                <p id="userNid" style="color: var(--text-muted); font-size: 0.8rem;">...</p>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="documents.html"><i class="fas fa-folder"></i> My Documents</a>
                <a href="history.html"><i class="fas fa-history"></i> History</a>
                <a href="todo.html"><i class="fas fa-tasks"></i> To Do</a>
                <a href="community.html"><i class="fas fa-users"></i> Community</a>
                <a href="market.html"><i class="fas fa-chart-line"></i> Market Info</a>
                <a href="events.html"><i class="fas fa-bullhorn"></i> Notices</a>
                <a href="education.html"><i class="fas fa-graduation-cap"></i> Education</a>
                <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
                <a href="javascript:void(0)" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-bar">
                <div class="header-left">
                    <div class="menu-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </div>
                    <a href="market.html" class="back-btn-shop">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1>Official Store</h1>
                        <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">Government publications &
                            souvenirs</p>
                    </div>
                </div>
                <div class="cart-btn" onclick="openCartModal()">
                    <i class="fas fa-shopping-basket"></i>
                    <span>Cart</span>
                    <span class="cart-count-badge" id="cartCountHeader">0</span>
                </div>
            </div>

            <div class="shop-content">
                <div class="shop-grid" id="shopItemsGrid">
                    <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Loading products...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Mobile Menu Toggle Script -->
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
    </script>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2><i class="fas fa-shopping-basket"></i> Your Cart</h2>
                <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
            </div>
            <div id="cartItemsList">
                <!-- Cart items will be loaded here -->
                <p class="empty-state">Loading cart...</p>
            </div>
            <div
                style="margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <h3>Total: <span id="cartTotal" style="color: #34d399;">৳ 0</span></h3>
                <button onclick="openCheckoutModal()" class="btn-primary" style="width: auto;">Proceed to
                    Checkout</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Checkout</h2>
                <button class="close-btn" onclick="closeModal('checkoutModal')">&times;</button>
            </div>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contactNumber" class="form-control" required placeholder="017...">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="deliveryAddress" class="form-control" required rows="3"
                        placeholder="Enter full address..."></textarea>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="paymentMethod" value="COD" checked> Cash on Delivery
                        </label>
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="paymentMethod" value="ONLINE"> Online Payment (SSLCommerz)
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Place Order</button>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
